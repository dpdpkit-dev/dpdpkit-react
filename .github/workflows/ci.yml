name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      # Until @dpdpkit/client is on npm, it is consumed from a sibling checkout (file:../dpdpkit-client).
      - uses: actions/checkout@v4
        with:
          path: dpdpkit-react
      - uses: actions/checkout@v4
        with:
          repository: dpdpkit-dev/dpdpkit-client
          path: dpdpkit-client
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Build @dpdpkit/client
        working-directory: dpdpkit-client
        run: npm ci && npm run build
      - working-directory: dpdpkit-react
        run: npm ci
      - working-directory: dpdpkit-react
        run: npm run typecheck
      - name: Tests (Testing Library + axe-core)
        working-directory: dpdpkit-react
        run: npm test
      - working-directory: dpdpkit-react
        run: npm run build
      - working-directory: dpdpkit-react
        run: npm audit --audit-level=high --omit=dev
