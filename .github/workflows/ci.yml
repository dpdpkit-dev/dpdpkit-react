name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]   # vitest 5 needs Node 22.12+
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (Testing Library + axe-core)
        run: npm test
      - run: npm run build
      - name: Bundle-size budget
        run: npm run size
      - run: npm audit --audit-level=high --omit=dev

  # The components in a real browser against a real backend: examples/fastapi_shop from dpdpkit-fastapi main.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: dpdpkit-dev/dpdpkit-fastapi
          path: _fastapi
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Backend
        run: |
          uv venv _venv
          uv pip install --python _venv             "dpdpkit-policies @ git+https://github.com/dpdpkit-dev/dpdpkit-policies@main"             "dpdpkit-core @ git+https://github.com/dpdpkit-dev/dpdpkit-core@main"             ./_fastapi uvicorn
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Widget tests (Playwright)
        run: npm run e2e
        env:
          DPDPKIT_FASTAPI_DIR: _fastapi
          DPDPKIT_PYTHON: ${{ github.workspace }}/_venv/bin/python
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
